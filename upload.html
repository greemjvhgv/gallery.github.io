<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Page</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>

<body class="mainbody">

  <div class="navbar">
    <div class="navbar-brand">PINSTA</div>
     <a href="upload.html" class="active" aria-current="page">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 21h14"/></svg>
      Upload Image
    </a>
    <a href="gallery.html">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Gallery
    </a>
    <a href="groups.html">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="14" height="14" rx="1"/><path d="M7 7V4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-3"/></svg>
      Group Gallery
    </a>
    <a href="#" id="logoutBtn">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      Logout
    </a>
  </div>

  <div class="main">
    <header class="groups-hero">
      <h1 class="page-title">Upload</h1>
    </header>

    <section class="upload-layout">

      <label for="fileInput" id="dropZone" class="upload-drop">
        <input type="file" id="fileInput" accept="image/*" />
        <div class="upload-drop-empty">
          <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
          <p class="upload-drop-title">Drop an image here</p>
          <p class="upload-drop-hint">or click to browse &middot; PNG, JPG, GIF, WEBP</p>
        </div>
        <img id="preview" class="upload-drop-preview" alt="Selected image preview" />
      </label>

      <div class="upload-details">

        <div class="upload-field">
          <span class="upload-label">File</span>
          <div class="upload-file-row">
            <span id="fileName" class="upload-file-name">No image selected</span>
            <button type="button" id="clearFileBtn" class="upload-text-btn" hidden>Remove</button>
          </div>
        </div>

        <div class="upload-field">
          <label for="tagsInput" class="upload-label">Tags</label>
          <input type="text" id="tagsInput" class="upload-input" placeholder="e.g. anime, dark, aesthetic" autocomplete="off" />
          <span class="upload-hint">Separate tags with commas</span>
        </div>

        <div class="upload-field">
          <span class="upload-label">Category</span>
          <div class="upload-segments" role="radiogroup" aria-label="Category">
            <label class="upload-segment">
              <input type="radio" name="category" value="avatar" checked>
              <span>Avatar</span>
            </label>
            <label class="upload-segment">
              <input type="radio" name="category" value="banner">
              <span>Banner</span>
            </label>
            <label class="upload-segment">
              <input type="radio" name="category" value="both">
              <span>Both</span>
            </label>
          </div>
        </div>

        <button id="uploadBtn" type="button" class="upload-submit" disabled>Upload</button>
        <p id="uploadStatus" class="upload-status" aria-live="polite"></p>

      </div>
    </section>
  </div>

</body>

<script>
  const supabaseUrl = 'https://agikgxernopojicgkpfy.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFnaWtneGVybm9wb2ppY2drcGZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ1NjE1NDksImV4cCI6MjA3MDEzNzU0OX0.8r5eWuWRhcF9pitenwVM-D-8uXlDGqD4zGDk1PxrmS0';
  const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

  const fileInput = document.getElementById('fileInput');
  const dropZone = document.getElementById('dropZone');
  const preview = document.getElementById('preview');
  const fileName = document.getElementById('fileName');
  const clearFileBtn = document.getElementById('clearFileBtn');
  const uploadBtn = document.getElementById('uploadBtn');
  const tagsInput = document.getElementById('tagsInput');
  const uploadStatus = document.getElementById('uploadStatus');
  const logoutBtn = document.getElementById('logoutBtn');
  let selectedFile = null;
  let currentUser = null;
  let previewUrl = null;

  function getCategories() {
    const value = document.querySelector('input[name="category"]:checked').value;

    if (value === "avatar") return ["avatar"];
    if (value === "banner") return ["banner"];
    if (value === "both") return ["avatar", "banner"];
    return ["none"];
  }

  function setStatus(text, state) {
    uploadStatus.textContent = text;
    uploadStatus.dataset.state = state || '';
  }

  //AUTHENTICATION STUFF------------------------------------------------------------------------------------------------------------------------------------------------
  async function initializePageAuth() {
    const { data: { session }, error } = await supabaseClient.auth.getSession();

    if (error) {
      console.error('Error getting session:', error);
      return;
    }

    if (!session) {
      window.location.href = 'index.html';
      return;
    }

    currentUser = session.user;
  }

  initializePageAuth();

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT') {
      window.location.href = 'index.html';
      return;
    }
    if (session) {
      currentUser = session.user;
    }
  });

  logoutBtn.addEventListener('click', async (e) => {
    e.preventDefault();
    const { error } = await supabaseClient.auth.signOut();
    if (error) {
      console.error('Error logging out:', error.message);
      alert(`Error logging out: ${error.message}`);
      return;
    }
    window.location.href = 'index.html';
  });

  //FILE SELECTION------------------------------------------------------------------------------------------------------------------------------------------------
  function setSelectedFile(file) {
    if (previewUrl) {
      URL.revokeObjectURL(previewUrl);
      previewUrl = null;
    }

    if (file && !file.type.startsWith('image/')) {
      setStatus('That file is not an image.', 'error');
      file = null;
    }

    selectedFile = file || null;

    if (selectedFile) {
      previewUrl = URL.createObjectURL(selectedFile);
      preview.src = previewUrl;
      dropZone.classList.add('has-file');
      fileName.textContent = selectedFile.name;
      clearFileBtn.hidden = false;
      uploadBtn.disabled = false;
      setStatus('');
    } else {
      preview.removeAttribute('src');
      dropZone.classList.remove('has-file');
      fileName.textContent = 'No image selected';
      clearFileBtn.hidden = true;
      uploadBtn.disabled = true;
      fileInput.value = '';
    }
  }

  fileInput.addEventListener('change', (event) => {
    setSelectedFile(event.target.files[0]);
  });

  clearFileBtn.addEventListener('click', () => setSelectedFile(null));

  ['dragenter', 'dragover'].forEach(type => {
    dropZone.addEventListener(type, (e) => {
      e.preventDefault();
      dropZone.classList.add('is-dragging');
    });
  });

  ['dragleave', 'drop'].forEach(type => {
    dropZone.addEventListener(type, (e) => {
      e.preventDefault();
      dropZone.classList.remove('is-dragging');
    });
  });

  dropZone.addEventListener('drop', (e) => {
    const file = e.dataTransfer.files[0];
    if (file) setSelectedFile(file);
  });

  //UPLOAD------------------------------------------------------------------------------------------------------------------------------------------------
  async function uploadImage() {
    if (!currentUser) {
      setStatus('You must be logged in to upload photos.', 'error');
      return;
    }

    if (!selectedFile) {
      setStatus('Please choose an image first.', 'error');
      return;
    }

    const filePath = `uploads/${Date.now()}_${selectedFile.name}`;

    uploadBtn.disabled = true;
    uploadBtn.textContent = 'Uploading…';
    dropZone.classList.add('is-uploading');
    setStatus('');

    try {
      const { error: uploadError } = await supabaseClient
        .storage
        .from('images')
        .upload(filePath, selectedFile);

      if (uploadError) {
        console.error('Error uploading image:', uploadError);
        setStatus(`Upload failed: ${uploadError.message}`, 'error');
        return;
      }

      const { data: publicUrlData } = supabaseClient
        .storage
        .from("images")
        .getPublicUrl(filePath);

      const tags = tagsInput.value
        .split(',')
        .map(tag => tag.trim())
        .filter(Boolean);

      const { error: insertError } = await supabaseClient
        .from('photos')
        .insert([{
          image_url: publicUrlData.publicUrl,
          tags: tags,
          categories: getCategories(),
          user_id: currentUser.id
        }]);

      if (insertError) {
        console.error('Error inserting URL into database:', insertError);
        setStatus(`Database error: ${insertError.message}`, 'error');
        return;
      }

      tagsInput.value = "";
      setSelectedFile(null);
      setStatus('Uploaded! Add another, or head back to the gallery.', 'success');
    } finally {
      dropZone.classList.remove('is-uploading');
      uploadBtn.textContent = 'Upload';
      uploadBtn.disabled = !selectedFile;
    }
  }

  uploadBtn.addEventListener('click', uploadImage);
</script>

</html>
