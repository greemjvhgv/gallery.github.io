<html>
<head>
  <title>Landing Page</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="main.css">
</head>

<body class="mainbody">
  <div class="top-fade" aria-hidden="true"></div>
  <a href="login.html"><button  id="loginBtn" class="loginBtn">Login</button></a>
  <div class="main full-width">
    <div class="preview">
      <div id="gallery" class="gallery-grid"></div>
      <div class="preview-fade" aria-hidden="true"></div>
    </div>
  </div>
  <br>
  <h1>Login to see more</h1>
  <br>
</body>

<script>
  const supabaseUrl = 'https://agikgxernopojicgkpfy.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFnaWtneGVybm9wb2ppY2drcGZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ1NjE1NDksImV4cCI6MjA3MDEzNzU0OX0.8r5eWuWRhcF9pitenwVM-D-8uXlDGqD4zGDk1PxrmS0';
  const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

  const gallery = document.getElementById('gallery');
  const PREVIEW_COUNT = 28;

  function pickRandom(items, n) {
    const copy = items.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy.slice(0, n);
  }

  function randomPlaceholderHeight() {
    return 160 + Math.floor(Math.random() * 180);
  }

  function showPhotoSkeletons() {
    gallery.innerHTML = "";
    for (let i = 0; i < 18; i++) {
      const skeleton = document.createElement('div');
      skeleton.className = 'photo-container photo-skeleton';
      skeleton.style.height = `${randomPlaceholderHeight()}px`;
      gallery.appendChild(skeleton);
    }
  }

  async function loadPreview() {
    showPhotoSkeletons();

    const { data, error } = await supabaseClient
      .from('photos')
      .select('id, image_url');

    gallery.innerHTML = "";

    if (error) {
      console.error('Error loading photos:', error);
      return;
    }

    function getThumbUrl(url, width) {
      // Supabase image transformation is not enabled on this project's plan,
      // so thumbnails just use the original file.
      return url;
    }

    pickRandom(data, PREVIEW_COUNT).forEach((photo, i) => {
      const container = document.createElement('div');
      container.classList.add('photo-container');

      const img = document.createElement('img');
      container.classList.add('is-loading');
      container.style.minHeight = `${randomPlaceholderHeight()}px`;
      const done = () => {
        container.classList.remove('is-loading');
        container.style.minHeight = '';
      };
      img.addEventListener('load', done, { once: true });
      img.addEventListener('error', done, { once: true });
      img.src = getThumbUrl(photo.image_url, 400);
      img.loading = i < 6 ? 'eager' : 'lazy';
      img.decoding = 'async';
      if (i < 6) img.fetchPriority = 'high';
      img.alt = '';

      container.appendChild(img);
      gallery.appendChild(container);
    });
  }

  loadPreview();
</script>

</html>
