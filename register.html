<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="loginModal" class="modal" style="display: flex;">
    <div class="modal-content animate">
      <div class="auth-header">
        <p class="modal-eyebrow">Welcome!</p>
        <h1 class="auth-title">Sign up</h1>
      </div>
      <form id="signup-form" class="auth-form">
        <div class="container">

          <div class="form-group">
            <label for="username"><b>Username</b></label>
            <input type="text" id="username" placeholder="Enter username">
            <small class="error-message"></small>
          </div>

          <div class="form-group">
            <label for="email"><b>Email</b></label>
            <input type="text" placeholder="Enter Email" id="email">
            <small class="error-message"></small>
          </div>

          <div class="form-group">
            <label for="password"><b>Password</b></label>
            <input type="password" placeholder="Enter Password" id="password">
            <small class="error-message"></small>
          </div>
        </div>
        <br>
        <small id="form-status" class="error-message"></small>
        <button type="submit" id="signup-btn" class="auth-btn">Sign Up</button>
      </form>
      <div class="auth-footer">
        Have an account? <a href="login.html">Login</a>
      </div>
    </div>
  </div>

  <script>
    const supabaseUrl = 'https://agikgxernopojicgkpfy.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFnaWtneGVybm9wb2ppY2drcGZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ1NjE1NDksImV4cCI6MjA3MDEzNzU0OX0.8r5eWuWRhcF9pitenwVM-D-8uXlDGqD4zGDk1PxrmS0';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    const signupForm = document.getElementById('signup-form');
    const usernameInput = document.getElementById('username');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const formStatus = document.getElementById('form-status');
    const signupBtn = document.getElementById('signup-btn');

    const USERNAME_MAX_LENGTH = 20;
    const PASSWORD_MIN_LENGTH = 6; // Supabase itself requires 6+ characters, so this must stay >= 6.
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    function showError(input, message) {
      const formGroup = input.parentElement;
      formGroup.className = 'form-group error';
      const small = formGroup.querySelector('.error-message');
      small.textContent = message;
    }

    function showSuccess(input) {
      const formGroup = input.parentElement;
      formGroup.className = 'form-group success';
      const small = formGroup.querySelector('.error-message');
      small.textContent = '';
    }

    function validateForm() {
      let isValid = true;
      const username = usernameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      // Username
      if (username === '') {
        showError(usernameInput, 'Username is required.');
        isValid = false;
      } else if (username.length > USERNAME_MAX_LENGTH) {
        showError(usernameInput, `Username must be under ${USERNAME_MAX_LENGTH} characters.`);
        isValid = false;
      } else {
        showSuccess(usernameInput);
      }

      // Email
      if (email === '') {
        showError(emailInput, 'Email is required.');
        isValid = false;
      } else if (!emailRegex.test(email)) {
        showError(emailInput, 'Please enter a valid email address.');
        isValid = false;
      } else {
        showSuccess(emailInput);
      }

      // Password
      if (password === '') {
        showError(passwordInput, 'Password is required.');
        isValid = false;
      } else if (password.length < PASSWORD_MIN_LENGTH) {
        showError(passwordInput, `Password must be more than ${PASSWORD_MIN_LENGTH - 1} characters.`);
        isValid = false;
      } else {
        showSuccess(passwordInput);
      }

      return isValid;
    }

    async function usernameExists(username) {
      const { data, error } = await supabaseClient
        .from('profiles')
        .select('id')
        .eq('username', username)
        .maybeSingle();

      if (error) {
        console.error('Username lookup error:', error);
        throw error;
      }
      return !!data;
    }

    signupForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      formStatus.textContent = '';

      if (!validateForm()) {
        return;
      }

      const username = usernameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      signupBtn.disabled = true;

      try {
        // Check the database for an existing user with the same username.
        if (await usernameExists(username)) {
          showError(usernameInput, 'That username is already taken.');
          return;
        }

        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password,
          options: {
            data: { username }
          }
        });

        if (error) {
          if (/registered|exists/i.test(error.message)) {
            showError(emailInput, 'An account with that email already exists.');
          } else {
            formStatus.textContent = `Error: ${error.message}`;
          }
          return;
        }

        if (data.session) {
          window.location.href = 'gallery.html';
        } else {
          formStatus.style.color = '#4caf50';
          formStatus.textContent = 'Account created! Please check your email to confirm before logging in.';
        }
      } catch (err) {
        console.error('Signup error:', err);
        formStatus.textContent = 'Something went wrong. Please try again.';
      } finally {
        signupBtn.disabled = false;
      }
    });
  </script>

</body>

</html>
