<!DOCTYPE html>
<html>

<head>
    <title>Group Page</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="mainbody">

    <div class="navbar">
        <div class="navbar-brand">PINSTA</div>
        <a href="gallery.html">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            Gallery
        </a>
    </div>

    <div class="main">
        <h1 id="groupsHeading">Group Gallery</h1>
        <p id="message"></p>
        <div id="groupgallery"></div>
    </div>

    <button onclick="topFunction()" id="topBtn">Top</button>

</body>

<script>
    const supabaseUrl = 'https://agikgxernopojicgkpfy.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFnaWtneGVybm9wb2ppY2drcGZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ1NjE1NDksImV4cCI6MjA3MDEzNzU0OX0.8r5eWuWRhcF9pitenwVM-D-8uXlDGqD4zGDk1PxrmS0';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    const topBtn = document.getElementById("topBtn");
    const groupgallery = document.getElementById('groupgallery');
    const message = document.getElementById('message');

    window.onscroll = function () { scrollFunction() };

    async function scrollFunction() {
        if (document.body.scrollTop > 80 || document.documentElement.scrollTop > 50) {
            topBtn.style.display = "block";
        } else {
            topBtn.style.display = "none";
        }
    }

    topBtn.addEventListener("click", topFunction);
    function topFunction() {
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;
    }

    //AUTHENTICATION STUFF------------------------------------------------------------------------------------------------------------------------------------------------
    let isAdmin = false;
    let isAdminCheckedFor = null;

    async function checkIsAdmin(userId) {
        const { data, error } = await supabaseClient
            .from('profiles')
            .select('is_admin')
            .eq('id', userId)
            .maybeSingle();

        if (error) {
            console.error('Error checking admin status:', error);
            return false;
        }
        return !!(data && data.is_admin);
    }

    async function updateUIForAuth(session) {
        const photoContainers = document.querySelectorAll('.group-container');
        if (session) {  // User is logged in
            if (isAdminCheckedFor !== session.user.id) {
                isAdmin = await checkIsAdmin(session.user.id);
                isAdminCheckedFor = session.user.id;
            }
            photoContainers.forEach(container => {
                container.classList.toggle('can-delete', isAdmin);
            });
        } else {  // User is logged out
            isAdmin = false;
            isAdminCheckedFor = null;
            groupgallery.style.display = 'none';
            message.innerHTML = "Please Log In to see Groups!"
            photoContainers.forEach(container => {
                container.classList.remove('can-delete');
            });
        }
    }

    async function initializeAuth() {
        const { data: { session }, error } = await supabaseClient.auth.getSession();
        if (error) {
            console.error('Error getting session:', error);
        }
        if (!session) {
            window.location.href = 'index.html';
            return;
        }
        updateUIForAuth(session);
    }

    initializeAuth();

    supabaseClient.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_OUT') {
            window.location.href = 'index.html';
            return;
        }
        if (session) {
            updateUIForAuth(session);
        }
    });

    //GALLERY STUFF------------------------------------------------------------------------------------------------------------------------------------------------
    function getThumbUrl(url, width) {
        return url;
    }

    async function loadGroups() {

        const { data, error } = await supabaseClient
            .from('groups')
            .select();

        if (error) {
            console.error('Error loading photos:', error);
            return;
        }

        data.forEach((group, i) => {
            const container = document.createElement("div");
            container.classList.add("group-container");
            container.dataset.groupId = group.id;

            const profileDiv = document.createElement('div');
            profileDiv.className = 'profile-div';
            const profileImg = document.createElement('img');
            profileImg.className = 'profileImg';
            profileImg.src = getThumbUrl(group.profile_url, 400);
            profileImg.loading = i < 4 ? 'eager' : 'lazy';
            profileImg.decoding = 'async';

            const bannerDiv = document.createElement('div');
            bannerDiv.className = 'banner-div';
            const bannerImg = document.createElement('img');
            bannerImg.className = 'bannerImg';
            bannerImg.src = getThumbUrl(group.banner_url, 800);
            bannerImg.loading = i < 4 ? 'eager' : 'lazy';
            bannerImg.decoding = 'async';

            const button = document.createElement('button');
            button.className = "del";
            button.textContent = "delete";
            button.classList.add('delete-button');
            button.addEventListener("click", () => {
                deleteGroup(group)
            });

            bannerDiv.appendChild(bannerImg);
            profileDiv.appendChild(profileImg);
            container.appendChild(button);
            container.appendChild(bannerDiv);
            container.appendChild(profileDiv);
            groupgallery.appendChild(container);
        });
        const { data: { session } } = await supabaseClient.auth.getSession();
        updateUIForAuth(session);
    }

    async function deleteGroup(group) {
        if (!isAdmin) {
            alert('Only admins can delete groups.');
            return;
        }

        const { error } = await supabaseClient
            .from('groups')
            .delete()
            .eq('id', group.id);

        if (error) {
            console.error('Error deleting group:', error);
            alert('Failed to delete group!');
            return;
        }

        const container = document.querySelector(`.group-container[data-group-id="${group.id}"]`);
        container.remove();
    }

    loadGroups();
</script>

</html>>
