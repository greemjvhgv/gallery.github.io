<html>

<head>
  <title>Main Page</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body class="mainbody">

  <div id="navbar" class="navbar">
    <div class="navbar-brand">PINSTA</div>
    <a href="upload.html">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 21h14"/></svg>
      Upload Image
    </a>
    <a href="#" id="enableGroupModeBtn">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Group Mode
    </a>
    <a href="groups.html">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="14" height="14" rx="1"/><path d="M7 7V4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-3"/></svg>
      Group Gallery
    </a>
   <button id="groupBtn" style="display: none;">Group</button>

    <a href="#" id="logoutBtn">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      Logout
    </a>
  </div>

  <div class="main">

    <div class="top-search">
      <div class="search-bar-row">
        <div class="search-row">
          <input type="text" id="searchInput" placeholder="Search tags...">
          <select name="aorb" id="aorb">
            <option value="both" selected>All</option>
            <option value="avatar">Avatars</option>
            <option value="banner">Banners</option>
          </select>
          <button id="searchButton">Search</button>
        </div>
        <div id="pageSizeControls" class="page-size-controls">
          <span class="page-size-label">Show:</span>
          <button type="button" class="page-size-btn" data-size="6">6</button>
          <button type="button" class="page-size-btn" data-size="12">12</button>
          <button type="button" class="page-size-btn" data-size="24">24</button>
          <button type="button" class="page-size-btn" data-size="48">48</button>
          <button type="button" class="page-size-btn" data-size="all">Show All</button>
        </div>
      </div>
      <h2 id="h2" class="h2"></h2>
    </div>

    <div id="gallery" class="gallery-grid"></div>
    <div id="searchGallery" class="gallery-grid"></div>

    <div id="paginationControls" class="pagination-controls" style="display: none;">
      <button id="prevPageBtn" type="button" class="page-nav" aria-label="Previous page">&#8249;</button>
      <div id="pageNumbers" class="page-numbers"></div>
      <button id="nextPageBtn" type="button" class="page-nav" aria-label="Next page">&#8250;</button>
    </div>
  </div>

  <!--GROUP STUFF-->
  <form>
    <div id="id01" class="modal" style="display: none;">
      <div class="group-modal animate">
        <button type="button" onclick="document.getElementById('id01').style.display='none'"
          class="cancelbtn">&times;</button>
        <div id="formHeader">
          <h2>Are you happy with this group?</h2>
          <div id="loader" class="loader" style="display: none;"></div>
          <p id="uploadmessage"></p>
        </div>
        <div class="row">
          <div class="column column--profile">
            <div class="container" id="profileContainer"></div>
          </div>
          <div class="column column--banner">
            <div class="container" id="bannerContainer"></div>
          </div>
        </div>
        <button id="confirmBtn" onclick="confirmGroup()" type="button">Confirm</button>
      </div>
    </div>
  </form>

  <div id="myModal" class="modal" style="display: none;">
    <div class="modal-content-img animate">
      <button onclick="document.getElementById('myModal').style.display='none'" class="imgCnl">&times;</button>
      <div class="modal-inner">
        <img class="img-modal-media" id="img01">
        <div class="modal-info">
          <h2>Image info</h2>
          <hr class="new5">
          <div>
            <strong>Tags:</strong>
            <div id="modalTags" class="meta-list"></div>
          </div>
          <br />
          <div>
            <strong>Categories:</strong>
            <div id="modalCategories" class="meta-list"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <button onclick="topFunction()" id="topBtn">Top</button>

</body>

<script>
  console.log("UPLOAD PAGE JS LOADED");
  const supabaseUrl = 'https://agikgxernopojicgkpfy.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFnaWtneGVybm9wb2ppY2drcGZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ1NjE1NDksImV4cCI6MjA3MDEzNzU0OX0.8r5eWuWRhcF9pitenwVM-D-8uXlDGqD4zGDk1PxrmS0';
  const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

  const topBtn = document.getElementById("topBtn");
  const gallery = document.getElementById('gallery');
  const loader = document.getElementById('loader');
  const UploadMessage = document.getElementById('uploadmessage');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const authStatus = document.getElementById('auth-status');
  const navbar = document.querySelector('.navbar');
  const h1 = document.getElementById('h1');
  const h2 = document.getElementById('h2');
  const logoutBtn = document.getElementById('logoutBtn');
  const groupBtn = document.getElementById("groupBtn");
  const groupModeBtn = document.getElementById('enableGroupModeBtn');
  const imageModal = document.getElementById('myModal');
  const modalImg = document.getElementById("img01");
  const searchInput = document.getElementById('searchInput');
  const searchButton = document.getElementById('searchButton');
  const searchResultsGal = document.getElementById('searchGallery');
  const dropdown = document.getElementById("aorb");
  const modalTags = document.getElementById("modalTags");
  const modalCategories = document.getElementById("modalCategories");
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const paginationControls = document.getElementById('paginationControls');
  const prevPageBtn = document.getElementById('prevPageBtn');
  const nextPageBtn = document.getElementById('nextPageBtn');
  const pageNumbers = document.getElementById('pageNumbers');
  const pageSizeButtons = document.querySelectorAll('.page-size-btn');

  window.onscroll = function () { scrollFunction() };
  const selectedImages = new Set();
  let profile = null;
  let banner = null;
  let groupModeEnabled = false;

  async function scrollFunction() {
    if (document.body.scrollTop > 50 || document.documentElement.scrollTop > 50) {
      topBtn.style.display = "block";
    } else {
      topBtn.style.display = "none";
    }
  }

  topBtn.addEventListener("click", topFunction);
  function topFunction() {
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;
  }

  //AUTHENTICATION STUFF------------------------------------------------------------------------------------------------------------------------------------------------
  let isAdmin = false;
  let isAdminCheckedFor = null;

  async function checkIsAdmin(userId) {
    const { data, error } = await supabaseClient
      .from('profiles')
      .select('is_admin')
      .eq('id', userId)
      .maybeSingle();

    if (error) {
      console.error('Error checking admin status:', error);
      return false;
    }
    return !!(data && data.is_admin);
  }

  async function updateUIForAuth(session) {
    const photoContainers = document.querySelectorAll('.photo-container');
    const mainDiv = document.querySelector('.main');
    if (session) {  // User is logged in
      if (isAdminCheckedFor !== session.user.id) {
        isAdmin = await checkIsAdmin(session.user.id);
        isAdminCheckedFor = session.user.id;
      }
      navbar.style.display = "flex";
      dropdown.style.display = "block";
      searchInput.style.display = "block";
      searchButton.style.display = "block";

      mainDiv.classList.remove('full-width');
      photoContainers.forEach(container => {
        container.classList.toggle('can-delete', isAdmin);
      });
    } else {  // User is logged out
      isAdmin = false;
      isAdminCheckedFor = null;
      dropdown.style.display = "none";
      navbar.style.display = "none";
      searchInput.style.display = "none";
      searchButton.style.display = "none";
      mainDiv.classList.add('full-width');
      photoContainers.forEach(container => {
        container.classList.remove('can-delete');
      });

      if (groupModeEnabled) {
        groupModeEnabled = false;
        groupModeBtn.classList.remove('active');
        document.querySelectorAll('.group-checkbox').forEach(cb => {
          cb.style.display = 'none';
          cb.checked = false;
        });
        selectedImages.clear();
        h2.innerHTML = "";
        document.getElementById('id01').style.display = 'none';
        toggleGroupButton();
      }
    }
  }

  async function initializeAuth() {
    const { data: { session }, error } = await supabaseClient.auth.getSession();
    if (error) {
      console.error('Error getting session:', error);
    }
    if (!session) {
      window.location.href = 'main.html';
      return;
    }
    updateUIForAuth(session);
  }

  initializeAuth();

  supabaseClient.auth.onAuthStateChange((event, session) => {
    console.log('Auth state changed:', event, session);
    if (event === 'SIGNED_OUT') {
      window.location.href = 'main.html';
      return;
    }
    if (session) {
      updateUIForAuth(session);
    }
  });

  //GALLERY STUFF------------------------------------------------------------------------------------------------------------------------------------------------

  function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  const PAGE_SIZE_OPTIONS = [6, 24, 48];
  let PAGE_SIZE = 24;
  let showAllMode = false;
  const maxSelections = 2;
  let allPhotos = [];
  let currentPhotos = [];
  let currentPage = 1;
  let activeContainer = gallery;

  function setPageSize(size) {
    if (size === 'all') {
      showAllMode = true;
    } else {
      showAllMode = false;
      PAGE_SIZE = Number(size);
    }
    currentPage = 1;
    updatePageSizeButtonsUI();
    try { localStorage.setItem('gallery_page_size', size); } catch (e) { }
    renderCurrentPage();
  }

  function updatePageSizeButtonsUI() {
    pageSizeButtons.forEach(btn => {
      const active = showAllMode
        ? btn.dataset.size === 'all'
        : Number(btn.dataset.size) === PAGE_SIZE;
      btn.classList.toggle('active', active);
    });
  }

  pageSizeButtons.forEach(btn => {
    btn.addEventListener('click', () => setPageSize(btn.dataset.size));
  });

  (function restorePageSizePref() {
    let saved = null;
    try { saved = localStorage.getItem('gallery_page_size'); } catch (e) { }
    if (saved === 'all') {
      showAllMode = true;
    } else if (saved && PAGE_SIZE_OPTIONS.includes(Number(saved))) {
      PAGE_SIZE = Number(saved);
    }
    updatePageSizeButtonsUI();
  })();

  function getThumbUrl(url, width) {
    return url;
  }

  function renderPhotoCard(photo, index) {
    const container = document.createElement('div');
    container.classList.add('photo-container');
    container.classList.toggle('can-delete', isAdmin);

    const img = document.createElement('img');
    img.src = getThumbUrl(photo.image_url, 500);
    if (index !== undefined && index < 6) {
      img.loading = 'eager';
      img.fetchPriority = 'high';
    } else {
      img.loading = 'lazy';
    }
    img.decoding = 'async';

    img.onclick = function () {
      if (groupModeEnabled) {
        const checkbox = container.querySelector('.group-checkbox');
        checkbox.checked = !checkbox.checked;
        checkbox.dispatchEvent(new Event('change'));
      } else {
        imageModal.style.display = "flex";
        modalImg.src = photo.image_url;
        modalTags.innerHTML = "";
        modalCategories.innerHTML = "";

        if (Array.isArray(photo.tags)) {
          photo.tags.forEach(tag => {
            const span = document.createElement("span");
            span.textContent = tag;
            modalTags.appendChild(span);
          });
        }

        if (Array.isArray(photo.categories)) {
          photo.categories.forEach(cat => {
            const span = document.createElement("span");
            span.textContent = cat;
            modalCategories.appendChild(span);
          });
        }
      }
    };

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.style.display = groupModeEnabled ? 'block' : 'none';
    checkbox.checked = selectedImages.has(photo.image_url);
    checkbox.classList.add("group-checkbox");

    checkbox.addEventListener('change', function () {
      if (checkbox.checked && selectedImages.size >= maxSelections) {
        checkbox.checked = false;
        return;
      }
      if (checkbox.checked) {
        selectedImages.add(photo.image_url);
      } else {
        selectedImages.delete(photo.image_url);
      }
      toggleGroupButton();
    });

    const button = document.createElement('button');
    button.textContent = "delete";
    button.classList.add('delete-button');
    button.addEventListener("click", () => deletePhoto(photo));

    const tooltip = document.createElement('div');
    tooltip.classList.add('tags-tooltip', 'tags-overlay');
    let tagsArray = [];
    if (Array.isArray(photo.tags)) {
      tagsArray = photo.tags.map(t => t.toLowerCase());
    } else if (typeof photo.tags === 'string' && photo.tags.trim() !== '') {
      tagsArray = photo.tags
        .split(',')
        .map(t => t.trim().toLowerCase())
        .filter(Boolean);
    }
    tooltip.textContent = tagsArray.length ? tagsArray.join(', ') : 'No tags';

    container.appendChild(img);
    container.appendChild(tooltip);
    container.appendChild(button);
    container.appendChild(checkbox);
    return container;
  }

  function goToPage(page) {
    currentPage = page;
    renderCurrentPage();
    topFunction();
  }

  function buildPageList(current, total) {
    const pages = [];
    for (let i = 1; i <= total; i++) {
      if (i === 1 || i === total || (i >= current - 1 && i <= current + 1)) {
        pages.push(i);
      } else if (pages[pages.length - 1] !== '...') {
        pages.push('...');
      }
    }
    return pages;
  }

  function renderPaginationControls(totalPages) {
    pageNumbers.innerHTML = "";
    buildPageList(currentPage, totalPages).forEach(entry => {
      if (entry === '...') {
        const span = document.createElement('span');
        span.className = 'page-ellipsis';
        span.textContent = '...';
        pageNumbers.appendChild(span);
        return;
      }
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'page-number' + (entry === currentPage ? ' active' : '');
      btn.textContent = entry;
      btn.addEventListener('click', () => goToPage(entry));
      pageNumbers.appendChild(btn);
    });

    prevPageBtn.disabled = currentPage <= 1;
    nextPageBtn.disabled = currentPage >= totalPages;
  }

  function renderCurrentPage() {
    if (showAllMode) {
      activeContainer.innerHTML = "";
      currentPhotos.forEach((photo, i) => {
        activeContainer.appendChild(renderPhotoCard(photo, i));
      });
      paginationControls.style.display = "none";
      return;
    }

    const totalPages = Math.max(1, Math.ceil(currentPhotos.length / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;

    activeContainer.innerHTML = "";
    const start = (currentPage - 1) * PAGE_SIZE;
    currentPhotos.slice(start, start + PAGE_SIZE).forEach((photo, i) => {
      activeContainer.appendChild(renderPhotoCard(photo, i));
    });

    paginationControls.style.display = currentPhotos.length > PAGE_SIZE ? "flex" : "none";
    renderPaginationControls(totalPages);
  }

  prevPageBtn.addEventListener("click", () => {
    if (currentPage <= 1) return;
    goToPage(currentPage - 1);
  });

  nextPageBtn.addEventListener("click", () => {
    const totalPages = Math.max(1, Math.ceil(currentPhotos.length / PAGE_SIZE));
    if (currentPage >= totalPages) return;
    goToPage(currentPage + 1);
  });

  async function loadPhotos() {
    const { data, error } = await supabaseClient
      .from('photos')
      .select();

    if (error) {
      console.error('Error loading photos:', error);
      return;
    }

    shuffleArray(data);
    allPhotos = data;
    currentPhotos = allPhotos;
    activeContainer = gallery;
    currentPage = 1;
    renderCurrentPage();

    const { data: { session } } = await supabaseClient.auth.getSession();
    updateUIForAuth(session);
  }

  imageModal.onclick = function (e) {
    if (e.target === imageModal) {
      imageModal.style.display = "none";
    }
  };

  async function deletePhoto(photo) {
    if (!isAdmin) {
      alert('Only admins can delete photos.');
      return;
    }

    const filePath = photo.image_url.split('/storage/v1/object/public/images/uploads/')[1];

    const { error: storageError } = await supabaseClient.storage
      .from('images')
      .remove([filePath]);

    const { error: dbError } = await supabaseClient
      .from('photos')
      .delete()
      .eq('id', photo.id);

    allPhotos = allPhotos.filter(p => p.id !== photo.id);
    currentPhotos = currentPhotos.filter(p => p.id !== photo.id);
    selectedImages.delete(photo.image_url);
    renderCurrentPage();
  }

  loadPhotos();

  //GROUP STUFF------------------------------------------------------------------------------------------------------------------------------------------------
  groupModeBtn.onclick = function (e) {
    e.preventDefault();
    groupModeEnabled = !groupModeEnabled;
    //if you click group mode button, it makes checkboxes on each image and changes the H1 and adds a text explanation. If clicked again, it reverts everything
    if (groupModeEnabled) {
      groupModeBtn.classList.add('active');
      document.querySelectorAll('.group-checkbox').forEach(cb => cb.style.display = 'block');
      h2.innerHTML = 'Select 2 Images to group together. The first selected image will be the profile picture, the second the banner picture';
    } else {
      groupModeBtn.classList.remove('active');
      document.querySelectorAll('.group-checkbox').forEach(cb => {
        cb.style.display = 'none';
        cb.checked = false;
      });
      selectedImages.clear();
      h2.innerHTML = "";
      document.getElementById('id01').style.display = 'none';
    }
    toggleGroupButton();
  };

  async function toggleGroupButton() { //displays the group button if 2 checkboxes are checked
    if (selectedImages.size === 2) {
      groupBtn.style.display = "block";
      UploadMessage.textContent = "";
      groupBtn.onclick = function () {
        const urls = Array.from(selectedImages);
        profile = urls[0];
        banner = urls[1];

        document.getElementById('profileContainer').innerHTML = `
        <h3>Profile</h3>
        <img src="${profile}" class="preview-thumb preview-thumb--profile">`;
        document.getElementById('bannerContainer').innerHTML = `
        <h3>Banner</h3>
        <img src="${banner}" class="preview-thumb preview-thumb--banner">`;
        console.log(profile, banner);

        document.getElementById('id01').style.display = 'flex';
      };
    } else {
      groupBtn.style.display = "none";
      document.getElementById('id01').style.display = 'none';
    }
  }

  async function confirmGroup() {  //button that sends data to supabase
    loader.style.display = "block";
    const { data, error } = await supabaseClient
      .from('groups')
      .insert([{ profile_url: profile, banner_url: banner }]);

    if (error) {
      console.error('Error inserting URLs into database:', error);
      alert('Failed to save group!');
      return;
    }
    loader.style.display = "none";
    UploadMessage.innerHTML = "- - - - Uploaded! - - - -";
    document.getElementById('id01').style.display = 'flex';
    selectedImages.clear();
  }

  //LOGIN STUFF------------------------------------------------------------------------------------------------------------------------------------------------

  logoutBtn.addEventListener('click', async (e) => {
    e.preventDefault();
    // Get the current session
    const { data: { session }, error: getSessionError } = await supabaseClient.auth.getSession();
    if (getSessionError) {
      console.error('Error getting session before logout:', getSessionError.message);
      alert('Could not check session status. Please try again.');
      return;
    } if (!session) {
      console.warn('No active session found, cannot log out.');
      alert('You are not logged in.');
      updateUIForAuth(null);
      return;
    }
    // If a session exists, proceed with sign out
    const { error: signOutError } = await supabaseClient.auth.signOut();
    if (signOutError) {
      console.error('Error logging out:', signOutError.message);
      alert(`Error logging out: ${signOutError.message}`);
    } else {
      console.log('User logged out successfully.');
      window.location.href = "index.html";
    }
  });

  //SEARCH STUFF------------------------------------------------------------------------------------------------------------------------------------------------
  async function performSearch() {
    const searchTerm = searchInput.value.toLowerCase().trim();
    const selectedType = document.getElementById("aorb").value;

    if (!searchTerm && selectedType === "both") {
      searchResultsGal.style.display = "none";
      searchResultsGal.innerHTML = "";
      gallery.style.display = "inline-block";
      currentPhotos = allPhotos;
      activeContainer = gallery;
      currentPage = 1;
      renderCurrentPage();
      return;
    }

    const { data, error } = await supabaseClient
      .from('photos')
      .select('*');

    if (error) {
      console.error("Search error:", error);
      searchResultsGal.innerHTML = "<p>Error searching</p>";
      return;
    }

    gallery.style.display = "none";
    searchResultsGal.style.display = "inline-block";

    let filtered = data;
    if (searchTerm) {
      filtered = filtered.filter(photo =>
        Array.isArray(photo.tags) &&
        photo.tags.some(tag => tag.toLowerCase().includes(searchTerm))
      );
    } else if (selectedType !== "both") {
      filtered = filtered.filter(photo =>
        Array.isArray(photo.categories) &&
        photo.categories.map(c => c.toLowerCase()).includes(selectedType)
      );
    }

    if (selectedType === "both") {
      shuffleArray(filtered);
    }

    currentPhotos = filtered;
    activeContainer = searchResultsGal;
    currentPage = 1;
    renderCurrentPage();
  }

  searchButton.addEventListener("click", async (e) => {
    e.preventDefault();
    await performSearch();
  });

  document.getElementById("aorb").addEventListener("change", performSearch);

</script>

</html>
